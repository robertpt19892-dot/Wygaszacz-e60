name: Build E60 Cockpit Pro
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Step 1 Config
        run: |
          mkdir -p app/src/main/java/com/example/bmwe60cockpit
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > gradle.properties
          printf "pluginManagement {\n  repositories { google(); mavenCentral(); gradlePluginPortal() }\n}\ndependencyResolutionManagement {\n  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n  repositories { google(); mavenCentral() }\n}\nrootProject.name = 'E60-Cockpit-Pro'\ninclude ':app'\n" > settings.gradle
          printf "plugins {\n  id 'com.android.application' version '8.2.2' apply false\n  id 'org.jetbrains.kotlin.android' version '1.9.22' apply false\n}\n" > build.gradle
          printf "plugins {\n  id 'com.android.application'\n  id 'org.jetbrains.kotlin.android'\n}\nandroid {\n  namespace 'com.example.bmwe60cockpit'\n  compileSdk 34\n  defaultConfig {\n    applicationId 'com.example.bmwe60cockpit'\n    minSdk 24\n    targetSdk 34\n    versionCode 1\n    versionName '1.0'\n  }\n  compileOptions {\n    sourceCompatibility JavaVersion.VERSION_17\n    targetCompatibility JavaVersion.VERSION_17\n  }\n  kotlinOptions {\n    jvmTarget = '17'\n  }\n}\ndependencies {\n  implementation 'androidx.appcompat:appcompat:1.6.1'\n}\n" > app/build.gradle
          python3 -c '
          a = chr(97)+"nd"+chr(114)+"oid"
          s = chr(115)+"chemas."+a+".com"
          xml = "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:"+a+"=\"http://"+s+"/apk/res/"+a+"\">\n  <uses-permission "+a+":name=\""+a+".permission.RECEIVE_BOOT_COMPLETED\" />\n  <uses-permission "+a+":name=\""+a+".permission.SYSTEM_ALERT_WINDOW\" />\n  <application "+a+":allowBackup=\"true\" "+a+":label=\"E60 Cockpit Pro\" "+a+":theme=\"@style/Theme.AppCompat.NoActionBar\">\n    <activity "+a+":name=\".MainActivity\" "+a+":exported=\"true\" "+a+":launchMode=\"singleTask\" "+a+":screenOrientation=\"landscape\">\n      <intent-filter>\n        <action "+a+":name=\""+a+".intent.action.MAIN\" />\n        <category "+a+":name=\""+a+".intent.category.HOME\" />\n        <category "+a+":name=\""+a+".intent.category.DEFAULT\" />\n        <category "+a+":name=\""+a+".intent.category.LAUNCHER\" />\n      </intent-filter>\n    </activity>\n    <service "+a+":name=\".E60DreamService\" "+a+":exported=\"true\" "+a+":label=\"E60 Cockpit Pro\" "+a+":permission=\""+a+".permission.BIND_DREAM_SERVICE\">\n      <intent-filter>\n        <action "+a+":name=\""+a+".service.dreams.DreamService\" />\n        <category "+a+":name=\""+a+".intent.category.DEFAULT\" />\n      </intent-filter>\n    </service>\n    <receiver "+a+":name=\".BootReceiver\" "+a+":enabled=\"true\" "+a+":exported=\"true\">\n      <intent-filter>\n        <action "+a+":name=\""+a+".intent.action.BOOT_COMPLETED\" />\n        <action "+a+":name=\""+a+".intent.action.QUICKBOOT_POWERON\" />\n      </intent-filter>\n    </receiver>\n  </application>\n</manifest>"
          open("app/src/main/AndroidManifest.xml", "w").write(xml)
          '
      - name: Step 2 Gauges
        run: |
          cat << 'EOF' > app/src/main/java/com/example/bmwe60cockpit/GaugeViews.kt
          package com.example.bmwe60cockpit
          import android.content.Context
          import android.graphics.*
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.sin

          class Bmw3dLogoView(c: Context) : View(c) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              override fun onDraw(cv: Canvas) {
                  val cx = width / 2f; val cy = height / 2f; val r = minOf(cx, cy) - 6f
                  if (r <= 10f) return
                  p.style = Paint.Style.FILL; p.setShadowLayer(12f, 0f, 6f, Color.BLACK)
                  p.color = Color.parseColor("#1E293B"); cv.drawCircle(cx, cy, r, p); p.clearShadowLayer()
                  p.shader = LinearGradient(cx - r, cy - r, cx + r, cy + r, intArrayOf(Color.WHITE, Color.parseColor("#64748B"), Color.parseColor("#E2E8F0")), null, Shader.TileMode.CLAMP)
                  cv.drawCircle(cx, cy, r, p); p.shader = null
                  p.color = Color.parseColor("#090D16"); cv.drawCircle(cx, cy, r * 0.90f, p)
                  val ir = r * 0.62f; val rc = RectF(cx - ir, cy - ir, cx + ir, cy + ir)
                  p.color = Color.parseColor("#008AC9"); cv.drawArc(rc, 180f, 90f, true, p); cv.drawArc(rc, 0f, 90f, true, p)
                  p.color = Color.WHITE; cv.drawArc(rc, 270f, 90f, true, p); cv.drawArc(rc, 90f, 90f, true, p)
                  p.shader = LinearGradient(cx, cy - r, cx, cy + r * 0.2f, Color.parseColor("#55FFFFFF"), Color.TRANSPARENT, Shader.TileMode.CLAMP)
                  cv.drawCircle(cx, cy, r * 0.88f, p); p.shader = null
              }
          }

          class PerformanceGaugeView(c: Context, private val title: String, private val unit: String, private var minVal: Float, private var maxVal: Float, private val accentHex: String, private val iconType: Int) : View(c) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG); private var currentVal = minVal
              fun setMaxValue(newMax: Float) { if (newMax > minVal) { maxVal = newMax; currentVal = currentVal.coerceIn(minVal, maxVal); invalidate() } }
              fun setValue(v: Float) { currentVal = v.coerceIn(minVal, maxVal); invalidate() }
              override fun onDraw(cv: Canvas) {
                  val cx = width / 2f; val cy = height / 2f; val r = minOf(cx, cy) - 8f
                  if (r <= 16f) return
                  p.style = Paint.Style.FILL; p.setShadowLayer(14f, 0f, 8f, Color.parseColor("#CC000000"))
                  p.color = Color.parseColor("#0B0F19"); cv.drawCircle(cx, cy, r, p); p.clearShadowLayer()
                  p.style = Paint.Style.STROKE; p.strokeWidth = r * 0.08f
                  p.shader = LinearGradient(cx - r, cy - r, cx + r, cy + r, intArrayOf(Color.parseColor("#94A3B8"), Color.parseColor("#1E293B"), Color.parseColor("#64748B")), null, Shader.TileMode.CLAMP)
                  cv.drawCircle(cx, cy, r * 0.94f, p); p.shader = null
                  p.style = Paint.Style.FILL; p.shader = RadialGradient(cx, cy, r * 0.88f, Color.parseColor("#172033"), Color.parseColor("#070A10"), Shader.TileMode.CLAMP)
                  cv.drawCircle(cx, cy, r * 0.88f, p); p.shader = null
                  val arcR = r * 0.75f; val arcRect = RectF(cx - arcR, cy - arcR, cx + arcR, cy + arcR)
                  p.style = Paint.Style.STROKE; p.strokeCap = Paint.Cap.ROUND; p.strokeWidth = r * 0.11f
                  p.color = Color.parseColor("#1E293B"); cv.drawArc(arcRect, 135f, 270f, false, p)
                  val ratio = ((currentVal - minVal) / (maxVal - minVal)).coerceIn(0f, 1f)
                  p.color = Color.parseColor(accentHex); cv.drawArc(arcRect, 135f, 270f * ratio, false, p)
                  for (i in 0..10) {
                      val ang = Math.toRadians((135.0 + i * 27.0)); val innerF = if (i == 5) 0.54f else 0.58f
                      p.strokeWidth = if (i == 5) 3.5f else 2f; p.color = if (i / 10f <= ratio) Color.WHITE else Color.parseColor("#64748B")
                      cv.drawLine(cx + cos(ang).toFloat() * (r * innerF), cy + sin(ang).toFloat() * (r * innerF), cx + cos(ang).toFloat() * (r * 0.66f), cy + sin(ang).toFloat() * (r * 0.66f), p)
                  }
                  if (iconType == 4 || iconType == 5) {
                      p.style = Paint.Style.FILL; p.textAlign = Paint.Align.CENTER; p.color = Color.parseColor("#E2E8F0"); p.textSize = r * 0.17f; p.typeface = Typeface.DEFAULT_BOLD
                      cv.drawText(((minVal + maxVal) / 2f).toInt().toString(), cx, cy - r * 0.36f, p)
                  }
                  drawCenterSymbol(cv, cx, cy - r * 0.08f, r * 0.21f)
                  p.style = Paint.Style.FILL; p.textAlign = Paint.Align.CENTER; p.color = Color.WHITE; p.textSize = r * 0.29f; p.typeface = Typeface.DEFAULT_BOLD
                  cv.drawText(if (iconType == 3) String.format("%.1f", currentVal) else currentVal.toInt().toString(), cx, cy + r * 0.34f, p)
                  p.color = Color.parseColor("#94A3B8"); p.textSize = r * 0.15f; cv.drawText(unit, cx, cy + r * 0.53f, p)
              }
              private fun drawCenterSymbol(cv: Canvas, cx: Float, cy: Float, s: Float) {
                  p.style = Paint.Style.STROKE; p.strokeWidth = maxOf(2.5f, s * 0.14f); p.color = Color.parseColor(accentHex)
                  when (iconType) {
                      1 -> { cv.drawLine(cx, cy - s * 0.6f, cx, cy + s * 0.3f, p); p.style = Paint.Style.FILL; cv.drawCircle(cx, cy + s * 0.4f, s * 0.25f, p); p.style = Paint.Style.STROKE; cv.drawLine(cx - s * 0.5f, cy + s * 0.65f, cx + s * 0.5f, cy + s * 0.65f, p) }
                      2 -> { cv.drawRect(cx - s * 0.45f, cy - s * 0.1f, cx + s * 0.25f, cy + s * 0.35f, p); cv.drawLine(cx + s * 0.25f, cy + s * 0.05f, cx + s * 0.65f, cy - s * 0.25f, p); cv.drawLine(cx - s * 0.1f, cy - s * 0.1f, cx - s * 0.1f, cy - s * 0.35f, p) }
                      3 -> { cv.drawRect(cx - s * 0.55f, cy - s * 0.25f, cx + s * 0.55f, cy + s * 0.35f, p); cv.drawLine(cx - s * 0.35f, cy + s * 0.05f, cx - s * 0.15f, cy + s * 0.05f, p); cv.drawLine(cx + s * 0.15f, cy + s * 0.05f, cx + s * 0.35f, cy + s * 0.05f, p); cv.drawLine(cx + s * 0.25f, cy - s * 0.05f, cx + s * 0.25f, cy + s * 0.15f, p) }
                      else -> { p.style = Paint.Style.FILL; p.textSize = s * 0.85f; p.textAlign = Paint.Align.CENTER; cv.drawText(title, cx, cy + s * 0.25f, p) }
                  }
              }
          }
          EOF
      - name: Step 3 Settings
        run: |
          cat << 'EOF' > app/src/main/java/com/example/bmwe60cockpit/SettingsDialog.kt
      - name: Step 4a Manager
        run: |
          cat << 'EOF' > app/src/main/java/com/example/bmwe60cockpit/CockpitManager.kt
          package com.example.bmwe60cockpit
          import android.annotation.SuppressLint
          import android.content.Context
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import android.view.*
          import android.widget.*
          import java.io.File
          import java.io.FileOutputStream
          import kotlin.math.sin
          import kotlin.random.Random

          class CockpitManager(private val ctx: Context, private val isScreensaver: Boolean, private val onPickPhoto: ((Int) -> Unit)? = null) {
              val rootLayout = FrameLayout(ctx)
              private val prefs = ctx.getSharedPreferences("e60_cockpit_cfg", Context.MODE_PRIVATE)
              private val handler = Handler(Looper.getMainLooper())
              private lateinit var bgImage: ImageView; private lateinit var leftPanel: LinearLayout; private lateinit var rightPanel: LinearLayout; private lateinit var freeRightLayer: FrameLayout
              private lateinit var logoView: Bmw3dLogoView; private lateinit var gEct: PerformanceGaugeView; private lateinit var gEot: PerformanceGaugeView; private lateinit var gVolt: PerformanceGaugeView
              private lateinit var gNm: PerformanceGaugeView; private lateinit var gKm: PerformanceGaugeView; private lateinit var leftResizeHandle: View; private lateinit var rightResizeHandle: View
              private var editMode = false; private var lightState = 0; private var demoMode = false; private var phase = 0.0

              private val beepRunnable = object : Runnable {
                  override fun run() {
                      val vol = prefs.getInt("beep_vol", 80)
                      if (prefs.getBoolean("beep_on", true) && (lightState == 0 || (lightState == 1 && prefs.getBoolean("beep_pos", true))) && vol > 0) {
                          try { val tg = ToneGenerator(AudioManager.STREAM_ALARM, vol.coerceIn(1, 100)); tg.startTone(ToneGenerator.TONE_PROP_BEEP, 160); handler.postDelayed({ tg.release() }, 250) } catch (_: Exception) {}
                      }
                      handler.postDelayed(this, 10000)
                  }
              }

              private val demoRunnable = object : Runnable {
                  override fun run() {
                      if (!demoMode) return
                      phase += 0.07; val w = (sin(phase) + 1.0).toFloat() / 2f; val maxNm = prefs.getInt("max_nm", 400).toFloat()
                      gEct.setValue(86f + w * 8f); gEot.setValue(90f + w * 14f); gVolt.setValue(13.9f + w * 0.5f)
                      val nm = 50f + w * (maxNm - 50f); val rpm = 850f + w * 3200f + Random.nextInt(-20, 20)
                      gNm.setValue(nm); gKm.setValue((nm * rpm) / 7023f)
                      handler.postDelayed(this, 60)
                  }
              }

              init { buildUI(); applySettings(); handler.postDelayed(beepRunnable, 3000) }
              fun destroy() { demoMode = false; handler.removeCallbacksAndMessages(null) }

              fun savePhoto(slot: Int, uri: Uri) {
                  try {
                      val file = File(ctx.filesDir, "e60_bg_" + slot + ".jpg")
                      ctx.contentResolver.openInputStream(uri)?.use { inp -> FileOutputStream(file).use { out -> inp.copyTo(out) } }
                      updateBackgroundPhoto()
                  } catch (_: Exception) {}
              }

              private fun updateBackgroundPhoto() {
                  val file = File(ctx.filesDir, "e60_bg_" + lightState + ".jpg"); val fallback = File(ctx.filesDir, "e60_bg_0.jpg")
                  val target = if (file.exists()) file else if (fallback.exists()) fallback else null
                  if (target != null) { bgImage.setImageBitmap(BitmapFactory.decodeFile(target.absolutePath)); bgImage.visibility = View.VISIBLE } else bgImage.visibility = View.GONE
              }
          EOF
      - name: Step 4b Manager
        run: |
          cat << 'EOF' >> app/src/main/java/com/example/bmwe60cockpit/CockpitManager.kt
              @SuppressLint("ClickableViewAccessibility")
              private fun buildUI() {
                  rootLayout.setBackgroundColor(Color.parseColor("#05070B"))
                  bgImage = ImageView(ctx).apply { scaleType = ImageView.ScaleType.CENTER_CROP }; rootLayout.addView(bgImage, FrameLayout.LayoutParams(-1, -1))
                  freeRightLayer = FrameLayout(ctx); rootLayout.addView(freeRightLayer, FrameLayout.LayoutParams(-1, -1))
                  leftPanel = LinearLayout(ctx).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_HORIZONTAL; setPadding(12, 18, 12, 18) }
                  logoView = Bmw3dLogoView(ctx); leftPanel.addView(logoView)
                  val leftGaugesBox = LinearLayout(ctx).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; layoutParams = LinearLayout.LayoutParams(-1, 0, 1f) }
                  gEct = PerformanceGaugeView(ctx, "ECT", "°C", 40f, 120f, "#00A3E0", 1)
                  gEot = PerformanceGaugeView(ctx, "EOT", "°C", 40f, 150f, "#F59E0B", 2)
                  gVolt = PerformanceGaugeView(ctx, "VOLT", "V", 10f, 16f, "#10B981", 3)
                  leftGaugesBox.addView(gEct); leftGaugesBox.addView(gEot); leftGaugesBox.addView(gVolt); leftPanel.addView(leftGaugesBox)
                  rootLayout.addView(leftPanel, FrameLayout.LayoutParams(240, -1, Gravity.START))
                  leftResizeHandle = createResizeHandle { dx -> val w = (leftPanel.layoutParams.width + dx.toInt()).coerceIn(140, 480); prefs.edit().putInt("left_w", w).apply(); applySettings() }
                  rootLayout.addView(leftResizeHandle)
                  rightPanel = LinearLayout(ctx).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; setPadding(12, 18, 12, 18) }
                  rootLayout.addView(rightPanel, FrameLayout.LayoutParams(260, -1, Gravity.END))
                  rightResizeHandle = createResizeHandle { dx -> val w = (rightPanel.layoutParams.width - dx.toInt()).coerceIn(150, 520); prefs.edit().putInt("right_w", w).apply(); applySettings() }
                  rootLayout.addView(rightResizeHandle)
                  gNm = PerformanceGaugeView(ctx, "Nm", "Nm", 0f, 400f, "#E21B22", 4); gKm = PerformanceGaugeView(ctx, "KM", "KM", 0f, 200f, "#00A3E0", 5)
                  setupFreeDrag(gNm, "nm_x", "nm_y"); setupFreeDrag(gKm, "km_x", "km_y")
                  if (!isScreensaver) {
                      val topBtns = LinearLayout(ctx).apply { orientation = LinearLayout.HORIZONTAL; elevation = 40f }
                      val btnHome = Button(ctx).apply { text = "MENU"; textSize = 11f; typeface = Typeface.DEFAULT_BOLD; setTextColor(Color.WHITE); setPadding(0, 0, 0, 0); background = GradientDrawable().apply { setColor(Color.parseColor("#E60F172A")); setStroke(3, Color.parseColor("#E21B22")); cornerRadius = 45f }; layoutParams = LinearLayout.LayoutParams(110, 74).apply { rightMargin = 14 }; setOnClickListener { openStockDisplayMenu(ctx) } }
                      val btnGear = Button(ctx).apply { text = "⚙"; textSize = 22f; setTextColor(Color.WHITE); setPadding(0, 0, 0, 0); background = GradientDrawable().apply { setColor(Color.parseColor("#E60F172A")); setStroke(3, Color.parseColor("#38BDF8")); cornerRadius = 45f }; layoutParams = LinearLayout.LayoutParams(80, 74); setOnClickListener { showCockpitSettingsDialog(ctx, prefs, editMode, demoMode, { editMode = it; applySettings() }, { demoMode = it; if (demoMode) handler.post(demoRunnable) }, onPickPhoto, { lightState = it; updateBackgroundPhoto() }, { applySettings() }) } }
                      topBtns.addView(btnHome); topBtns.addView(btnGear)
                      rootLayout.addView(topBtns, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.END).apply { topMargin = 20; rightMargin = 24 })
                  }
                  gEct.setValue(89f); gEot.setValue(94f); gVolt.setValue(14.2f); gNm.setValue(120f); gKm.setValue(65f)
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun createResizeHandle(onDrag: (Float) -> Unit) = View(ctx).apply {
                  setBackgroundColor(Color.parseColor("#AA38BDF8")); var lastX = 0f
                  setOnTouchListener { _, ev -> if (!editMode) return@setOnTouchListener false; when (ev.action) { MotionEvent.ACTION_DOWN -> lastX = ev.rawX; MotionEvent.ACTION_MOVE -> { onDrag(ev.rawX - lastX); lastX = ev.rawX } }; true }
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupFreeDrag(v: View, keyX: String, keyY: String) {
                  var dX = 0f; var dY = 0f
                  v.setOnTouchListener { view, ev ->
                      if (!editMode || prefs.getBoolean("right_frame_mode", false)) return@setOnTouchListener false
                      val minX = (prefs.getInt("left_w", 240) + 12).toFloat()
                      when (ev.action) {
                          MotionEvent.ACTION_DOWN -> { dX = view.x - ev.rawX; dY = view.y - ev.rawY }
                          MotionEvent.ACTION_MOVE -> { view.x = (ev.rawX + dX).coerceIn(minX, (rootLayout.width - view.width).toFloat().coerceAtLeast(minX)); view.y = (ev.rawY + dY).coerceIn(0f, (rootLayout.height - view.height).toFloat().coerceAtLeast(0f)) }
                          MotionEvent.ACTION_UP -> prefs.edit().putFloat(keyX, view.x).putFloat(keyY, view.y).apply()
                      }; true
                  }
              }

              fun applySettings() {
