name: Build E60 Cockpit Pro
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Project
        run: |
          mkdir -p app/src/main/java/com/example/bmwe60cockpit
          cp *.kt app/src/main/java/com/example/bmwe60cockpit/
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > gradle.properties
          printf "pluginManagement {\n  repositories { google(); mavenCentral(); gradlePluginPortal() }\n}\ndependencyResolutionManagement {\n  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n  repositories { google(); mavenCentral() }\n}\nrootProject.name = 'E60-Cockpit-Pro'\ninclude ':app'\n" > settings.gradle
          printf "plugins {\n  id 'com.android.application' version '8.2.2' apply false\n  id 'org.jetbrains.kotlin.android' version '1.9.22' apply false\n}\n" > build.gradle
          printf "plugins {\n  id 'com.android.application'\n  id 'org.jetbrains.kotlin.android'\n}\nandroid {\n  namespace 'com.example.bmwe60cockpit'\n  compileSdk 34\n  defaultConfig {\n    applicationId 'com.example.bmwe60cockpit'\n    minSdk 24\n    targetSdk 34\n    versionCode 1\n    versionName '1.0'\n  }\n  compileOptions {\n    sourceCompatibility JavaVersion.VERSION_17\n    targetCompatibility JavaVersion.VERSION_17\n  }\n  kotlinOptions {\n    jvmTarget = '17'\n  }\n}\ndependencies {\n  implementation 'androidx.appcompat:appcompat:1.6.1'\n}\n" > app/build.gradle
          python3 -c '
          a = chr(97)+"nd"+chr(114)+"oid"
          s = chr(115)+"chemas."+a+".com"
          xml = "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:"+a+"=\"http://"+s+"/apk/res/"+a+"\">\n  <application "+a+":allowBackup=\"true\" "+a+":label=\"E60 Cockpit Pro\" "+a+":theme=\"@style/Theme.AppCompat.NoActionBar\">\n    <activity "+a+":name=\".MainActivity\" "+a+":exported=\"true\" "+a+":screenOrientation=\"landscape\">\n      <intent-filter>\n        <action "+a+":name=\""+a+".intent.action.MAIN\" />\n        <category "+a+":name=\""+a+".intent.category.LAUNCHER\" />\n      </intent-filter>\n    </activity>\n    <service "+a+":name=\".E60DreamService\" "+a+":exported=\"true\" "+a+":label=\"E60 Cockpit Pro\" "+a+":permission=\""+a+".permission.BIND_DREAM_SERVICE\">\n      <intent-filter>\n        <action "+a+":name=\""+a+".service.dreams.DreamService\" />\n        <category "+a+":name=\""+a+".intent.category.DEFAULT\" />\n      </intent-filter>\n    </service>\n  </application>\n</manifest>"
          open("app/src/main/AndroidManifest.xml", "w").write(xml)
          '
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: E60-Cockpit-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
